# resources/jobs.yml
# Lakeflow Job orchestration (capstone Part M). Included by databricks.yml.
# All notebook_task paths point at notebooks/*.ipynb -- every step of this
# job runs as a real Databricks notebook on a job cluster, nothing here
# runs on anyone's laptop.
#
# Task graph:
#
#   run_adls_ingestion  \
#   run_mongo_ingestion  }---> bronze_validation ---> silver_gold_pipeline ---> quality_and_reconciliation_report
#   run_kafka_ingestion /
#
# The three ingestion tasks are independent (no FK between their sources
# at Bronze) and run in parallel. `bronze_validation` depends on all
# three and is a hard gate: if it fails, the pipeline task does not run
# (default `run_if: ALL_SUCCESS`), so Silver/Gold are never built on
# partial or broken Bronze data. `quality_and_reconciliation_report` is
# the last task -- it checks data quality, reconciles Gold against
# Bronze, and (only if both pass) writes the dashboard freshness marker.

resources:
  jobs:
    medallion_pipeline_job:
      name: "[${bundle.target}] Maven Market Medallion Pipeline"
      max_concurrent_runs: 1
      tags:
        project: maven_market_capstone
        owner: platform_team

      email_notifications:
        on_failure: []   # fill in teammate emails before enabling a schedule (docs/TEAM_STEPS_ASHUTOSH.md pre-demo checklist)

      tasks:
        - task_key: run_adls_ingestion
          timeout_seconds: 1800
          max_retries: 2
          min_retry_interval_millis: 60000
          notebook_task:
            notebook_path: ../src/ingestion/01_bronze_adls_ingestion.ipynb
            base_parameters:
              catalog: ${var.catalog_name}
          new_cluster: &job_cluster
            spark_version: "15.4.x-scala2.12"
            node_type_id: "Standard_DS3_v2"
            num_workers: 1
            autotermination_minutes: 15
            data_security_mode: "SINGLE_USER"

        - task_key: run_mongo_ingestion
          timeout_seconds: 900
          max_retries: 2
          min_retry_interval_millis: 60000
          notebook_task:
            notebook_path: ../src/ingestion/02_bronze_mongo_ingestion.ipynb
            base_parameters:
              catalog: ${var.catalog_name}
          new_cluster: *job_cluster
          # pymongo/certifi aren't part of the Databricks Runtime. Instead of
          # a cluster-library YAML spec, this notebook's own first cell runs
          # `%pip install pymongo certifi` -- that installs onto THIS
          # cluster, for this job run, same as the reference notebook this
          # project started from. Simpler than a second place to maintain
          # the same two package names.

        - task_key: run_kafka_ingestion
          timeout_seconds: 900
          max_retries: 2
          min_retry_interval_millis: 60000
          notebook_task:
            notebook_path: ../src/ingestion/03_bronze_kafka_ingestion.ipynb
            base_parameters:
              catalog: ${var.catalog_name}
          new_cluster: *job_cluster

        - task_key: bronze_validation
          depends_on:
            - task_key: run_adls_ingestion
            - task_key: run_mongo_ingestion
            - task_key: run_kafka_ingestion
          timeout_seconds: 600
          max_retries: 1
          notebook_task:
            notebook_path: ../src/ingestion/04_bronze_validation.ipynb
            base_parameters:
              catalog: ${var.catalog_name}
          new_cluster: *job_cluster

        # Lakeflow Declarative Pipeline: Bronze -> Silver -> Gold (requirement 34).
        # run_if defaults to ALL_SUCCESS, so this never runs against a
        # Bronze layer that bronze_validation just reported as broken.
        - task_key: silver_gold_pipeline
          depends_on:
            - task_key: bronze_validation
          pipeline_task:
            pipeline_id: ${resources.pipelines.medallion_silver_gold_pipeline.id}

        # This one task covers the DQ summary + reconciliation check + the
        # dashboard freshness marker (src/transformation/07_quality_and_reconciliation.ipynb)
        # -- previously two separate tasks/files, merged since the freshness
        # marker only ever needs to run right after reconciliation passes.
        - task_key: quality_and_reconciliation_report
          depends_on:
            - task_key: silver_gold_pipeline
          timeout_seconds: 600
          max_retries: 0   # a reconciliation failure means investigate, not retry blindly
          notebook_task:
            notebook_path: ../src/transformation/07_quality_and_reconciliation.ipynb
            base_parameters:
              catalog: ${var.catalog_name}
          new_cluster: *job_cluster
