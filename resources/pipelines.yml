# resources/pipelines.yml
# Lakeflow Declarative Pipeline resource (capstone requirement 34).
# One pipeline, two library files: Bronze->Silver, then Silver->Gold,
# so Gold tables can dlt.read() Silver tables within the same DAG run.

resources:
  pipelines:
    medallion_silver_gold_pipeline:
      name: "[${bundle.target}] Maven Market Silver+Gold Pipeline"
      catalog: ${var.catalog_name}
      target: silver   # default publishing schema for silver_pipeline.py's tables;
                        # gold_pipeline.py's @dlt.table calls publish into `gold`
                        # via the `schema` override below (DLT pipelines support
                        # per-library/per-table schema targeting on current
                        # versions -- verify on your workspace and adjust to a
                        # second pipeline if your DBR version requires one
                        # pipeline per target schema).
      photon: false       # keep off for a capstone-scale dataset; revisit if profiling shows Photon helps (docs/PERFORMANCE)
      serverless: true    # prefer serverless DLT compute where entitlement allows; falls back to a small classic cluster otherwise (see below)
      development: true   # set false only for the `main` target's production run, once stable
      continuous: false   # triggered/batch, not 24/7 -- matches the cost-management decision in docs/TEAM_STEPS_ASHUTOSH.md

      libraries:
        - notebook:
            path: notebooks/05_silver_pipeline.ipynb
        - notebook:
            path: notebooks/06_gold_pipeline.ipynb

      configuration:
        catalog_name: ${var.catalog_name}

      clusters:
        - label: default
          node_type_id: "Standard_DS3_v2"
          autoscale:
            min_workers: 1
            max_workers: 2
            mode: ENHANCED
