# config/quality_rules.yaml
#
# The single catalog of data-quality rules referenced by:
#   - pipelines/bronze_to_silver/silver_pipeline.py (applies these as
#     Lakeflow expectations: @dlt.expect / @dlt.expect_or_drop / @dlt.expect_or_fail)
#   - src/silver/quality.py (builds the human-readable DQ summary report)
#   - config/data_contracts/*.yaml (each intentional_anomaly's
#     detection_rule names a rule_id defined here, so generator, contract,
#     and enforcement all agree on one name)
#   - tests/unit/test_quality_rules.py (checks every data-contract anomaly
#     has a matching rule_id here, and every rule_id has a sane action)
#
# action values, matching capstone requirement 43:
#   warn        -> row is kept, a quality-metric row is recorded
#   quarantine  -> row is dropped from the clean table, FULL row + reason
#                  is written to <schema>.ops.quarantine (never just logged)
#   fail        -> the whole pipeline update fails (used only for rules
#                  where continuing would make Gold actively wrong, not
#                  just incomplete)

rules:
  - rule_id: TXN_QTY_POSITIVE
    table: silver.transactions_clean
    dimension: validity
    description: "Transaction quantity must be a positive integer."
    predicate_sql: "quantity > 0"
    action: quarantine
    business_impact: "A zero/negative quantity cannot represent a real sale; counting it would overstate or corrupt Gross Sales."

  - rule_id: TXN_REQUIRED_KEYS
    table: silver.transactions_clean
    dimension: completeness
    description: "transaction_id, product_id, customer_id, store_id must all be present."
    predicate_sql: "transaction_id IS NOT NULL AND product_id IS NOT NULL AND customer_id IS NOT NULL AND store_id IS NOT NULL"
    action: fail
    business_impact: "A transaction missing its own identity or any dimension key cannot be joined or deduplicated; letting it through risks silently wrong aggregates across the whole fact table, not just one row."

  - rule_id: TXN_DEDUP
    table: silver.transactions_clean
    dimension: uniqueness
    description: "transaction_id must be unique (duplicates collapsed, keeping latest ingestion_timestamp)."
    predicate_sql: "ROW_NUMBER() OVER (PARTITION BY transaction_id ORDER BY ingestion_timestamp DESC) = 1"
    action: quarantine
    business_impact: "A duplicate transaction double-counts revenue if not removed."

  - rule_id: TXN_STOCK_BEFORE_TRANSACTION
    table: silver.transactions_clean
    dimension: consistency
    description: "stock_date should be on or before transaction_date."
    predicate_sql: "stock_date IS NULL OR stock_date <= transaction_date"
    action: warn
    business_impact: "A violation is suspicious but not fatal to revenue measures; flagged for investigation rather than dropped."

  - rule_id: RET_QTY_POSITIVE
    table: silver.returns_clean
    dimension: validity
    predicate_sql: "quantity > 0"
    action: quarantine
    business_impact: "A non-positive return quantity cannot be netted against sales correctly."

  - rule_id: RET_FK_PRODUCT
    table: silver.returns_clean
    dimension: referential_integrity
    predicate_sql: "product_id IN (SELECT product_id FROM silver.products_clean)"
    action: quarantine
    business_impact: "A return referencing a non-existent product cannot be attributed to any Gold category/profit rollup."

  - rule_id: STORE_COUNTRY_NORMALIZE
    table: silver.stores_scd2
    dimension: consistency
    description: "Standardize country-name variants (e.g. 'USA ', 'usa', 'United States' -> 'USA') via a lookup, not a drop."
    predicate_sql: "store_country IN ('USA','Mexico','Canada')"  # after normalization is applied upstream
    action: warn
    business_impact: "Inconsistent country naming would fragment regional rollups; this is a WARN because the value is corrected, not lost."

  - rule_id: ORD_PARSE_OK
    table: silver.online_orders_clean
    dimension: validity
    description: "The Kafka JSON payload must parse into all required typed fields."
    predicate_sql: "order_id IS NOT NULL AND customer_id IS NOT NULL AND product_id IS NOT NULL"
    action: quarantine
    business_impact: "An unparseable event has no usable business key; it is preserved in Bronze raw_payload forever, just excluded from Silver/Gold aggregates."

  - rule_id: ORD_QTY_POSITIVE
    table: silver.online_orders_clean
    dimension: validity
    predicate_sql: "quantity > 0"
    action: quarantine
    business_impact: "Same rationale as TXN_QTY_POSITIVE, applied to the streaming order fact."

  - rule_id: TXN_FK_PROMOTION
    table: silver.transactions_clean
    dimension: referential_integrity
    description: "A non-null promotion_id should resolve to a promotion active on transaction_date."
    predicate_sql: "promotion_id IS NULL OR promotion_id IN (SELECT promotion_id FROM silver.promotions_clean WHERE start_date <= transaction_date AND end_date >= transaction_date)"
    action: warn
    business_impact: "An orphaned promotion reference doesn't invalidate the sale itself (discount_amount is still honored); only the promotion attribution is unreliable, hence WARN not quarantine."

quarantine_schema: ops.quarantine
dq_summary_schema: ops.dq_summary
