# config/common.yaml
# Shared configuration and naming standards for the Maven Market Lakehouse.
# Environment-specific files (test.yaml, main.yaml) override only the values
# that differ per environment (catalog name, secret scope, etc.) and are
# merged by whatever notebook/script reads it (plain yaml.safe_load, no shared config module anymore).
#
# Owner: Ashutosh Jaiswal (governance/platform). Changes to naming
# conventions require team sign-off because every SQL script, notebook,
# and job definition in this repo depends on them.

naming_standards:
  catalog_pattern: "maven_<env>"                       # maven_test | maven_dev | maven_prod
  schema_names: [bronze, silver, gold, ops]
  table_pattern: "<schema>.<source>_<entity>"           # e.g. bronze.adls_transactions
  checkpoint_volume: "<catalog>.bronze.checkpoints"
  checkpoint_path_pattern: "/Volumes/<catalog>/bronze/checkpoints/<table>/state"
  schema_location_pattern: "/Volumes/<catalog>/bronze/checkpoints/<table>/schema"
  job_name_pattern: "[<target>] <workflow_name>"
  pipeline_name_pattern: "<env>_<layer>_pipeline"       # e.g. test_bronze_to_silver_pipeline
  dashboard_name_pattern: "Maven Market - <dashboard_title> (<env>)"
  group_name_pattern: "maven_<persona>"                 # e.g. maven_data_engineers

storage:
  storage_account: capstoneadls
  containers:
    landing:
      purpose: "Raw CSV drops from the local synthetic-data generator / POS export"
      paths:
        calendar: "operational/calendar/"
        promotions: "operational/promotions/"
        regions: "operational/regions/"
        stores: "operational/stores/"
        returns: "pos/returns/"
        transactions: "pos/transactions/"
    ucmeta:
      purpose: "Unity Catalog managed-table root, Auto Loader checkpoints, schema tracking"
  external_locations:
    adls_uc: landing
    dbx_cap: ucmeta

compute:
  shared_interactive_cluster: capstonecluster
  job_compute: job-scoped (ephemeral, created per job run, auto-terminating)
  sql_serving: serverless SQL warehouse preferred where entitlement allows; else small classic warehouse with auto-stop

secrets:
  key_vault_backed_scope: captone_scope   # NOTE: name preserved exactly as provisioned in the real workspace (typo and all).
  required_secrets:
    - kafka-bootstrap-server
    - kafka-api-key
    - kafka-api-secret
    - mongodb-conn-string

sources:
  kafka:
    topics:
      online_orders: online_orders
      inventory_restock: inventory_restock   # corrected from the repo's previous `inventory_events`
  mongodb:
    database: SPT_Stores   # confirmed real/production database holding master data
    # Exact collection names are discovered dynamically at ingestion time
    # (see notebooks/02_bronze_mongo_ingestion.ipynb) because they were not
    # confirmed beyond the database name itself. Known/expected collections
    # from the capstone design docs: a customer-master collection and a
    # product-master collection. Update this list once a teammate confirms
    # the exact collection names from the Atlas console.
    expected_collections:
      - customer_master   # placeholder logical name; actual name confirmed at runtime
      - product_master    # placeholder logical name; actual name confirmed at runtime

business_rules:
  # Single source of truth for measure definitions so the same KPI is never
  # defined twice. Gold SQL and dashboards must reference these definitions,
  # never redefine them ad hoc (capstone Project Rule: "same metric must not
  # have conflicting definitions").
  measures:
    gross_sales: "quantity * product_retail_price"
    discount_amount: "COALESCE(discount_amount, 0)"
    net_sales: "gross_sales - discount_amount"
    cost: "quantity * product_cost"
    profit: "net_sales - cost"
    margin_pct: "profit / net_sales"
    return_rate_pct: "returned_quantity / sold_quantity"
  returns_handling: >
    Returns are modeled as a separate fact (fact_returns) at
    (product, store, return_date) grain and are netted against sales only
    in Gold summary tables that explicitly compute "net of returns" metrics;
    fact_sales itself is never mutated by a return.
  late_and_duplicate_events: >
    Kafka events are deduplicated in Silver on business key
    (transaction_id for orders, restock_event_id for inventory) keeping the
    latest event_timestamp per key. Late events (event_timestamp earlier
    than the current watermark) are still written to Silver as long as they
    are within the configured watermark tolerance; events outside tolerance
    are quarantined, not dropped silently.

environments:
  test:
    git_branch: test
    catalog: maven_test
    description: "Shared integration/testing branch. All four teammates push here. Small data, bounded compute."
  main:
    git_branch: main
    catalog: maven_dev
    description: "Stable, reviewed branch. Deploys to the shared demonstration environment. Requires PR + passing CI."
  # maven_prod exists as a catalog (created previously) but is NOT targeted
  # by a permanent git branch per the team's branch-strategy decision
  # (2026-10-18): only `test` and `main` are permanent branches. maven_prod
  # is kept available for a possible future promotion step but is out of
  # scope for this capstone's CI/CD unless the team decides otherwise.
