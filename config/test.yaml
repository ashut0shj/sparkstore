# config/test.yaml
# Overrides for the `test` branch / maven_test catalog environment.
# Merged on top of config/common.yaml by src/common/config.py.

env: test
catalog: maven_test
git_branch: test

compute:
  job_compute_profile: small        # 1-2 node, auto-terminate 10 min idle
  sql_warehouse_size: "2X-Small"

data_volume:
  # test environment always uses small, synthetic datasets
  transactions_rows: 5000
  max_file_size_mb: 5

streaming:
  kafka_trigger: availableNow        # never run continuous streaming in test
  demo_continuous_window_minutes: 0  # continuous mode reserved for main/demo only

job_notifications:
  on_failure_email: []               # configure teammate emails before first scheduled run
