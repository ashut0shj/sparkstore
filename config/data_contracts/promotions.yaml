# Data contract: Promotions (new dataset — absent from the original source
# files, required by the capstone, and explicitly called out as missing in
# the team's own design notes)
# Source: ADLS Gen2 landing/operational/promotions/ (CSV, Auto Loader)
# Owner: Nagasupriya Bandlamudi (ingestion), Khushi Gupta (Gold dim_promotion)

dataset: promotions
source_system: SYNTHETIC_GENERATOR
destination:
  bronze: bronze.adls_promotions
  silver: silver.promotions_clean
  gold_contributes_to: [dim_promotion]

grain: "one row per promotion_id"
business_key: promotion_id

columns:
  - {name: promotion_id, type: string, nullable: false}
  - {name: promotion_name, type: string, nullable: false}
  - {name: start_date, type: date, nullable: false}
  - {name: end_date, type: date, nullable: false, note: "must be >= start_date"}
  - {name: discount_pct, type: decimal(5,2), nullable: true, note: "0-100; informational, actual discount_amount applied is on the transaction row"}
  - {name: channel, type: string, nullable: true, note: "e.g. in_store, online, both"}

generation_rationale: >
  Promotions only need to exist for the window where transactions carry a
  promotion_id, i.e. drop3 (2018 onward, see transactions.yaml). Generated
  with non-overlapping-per-channel windows so a transaction's
  promotion_id always resolves to exactly one active promotion on its
  transaction_date, which is what the Silver referential/temporal
  quality rule (PROMO_ACTIVE_ON_TXN_DATE) checks.

intentional_anomalies:
  - {code: ORPHAN_PROMOTION, effect: "a transaction's promotion_id does not exist in dim_promotion", detection_rule: "silver rule TXN_FK_PROMOTION, action=warn (promotion_id set to NULL, discount still honored from discount_amount)"}

anomaly_rate: 0.02
