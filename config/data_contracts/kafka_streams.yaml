# Data contracts: Kafka streams (online_orders, inventory_restock)
# Source: Confluent Cloud, produced by a local Python script
# (scripts/kafka_producer.py), consumed by Databricks Structured Streaming.
# Owner: Nagasupriya Bandlamudi (ingestion/Bronze), Khushi Gupta
# (Silver dedup/watermark), Mo Shayan Ul Haque (real-time dashboard consumer)

online_orders:
  topic: online_orders
  destination:
    bronze: bronze.kafka_online_orders_raw
    silver: silver.online_orders_clean
    gold_contributes_to: [fact_online_orders]
  grain: "one row per order_id"
  business_key: order_id
  event_time_field: event_timestamp
  payload_schema:
    - {name: order_id, type: string, nullable: false}
    - {name: customer_id, type: int, nullable: false}
    - {name: product_id, type: int, nullable: false}
    - {name: store_id, type: int, nullable: true, note: "fulfilling store; null allowed for pure e-commerce fulfillment"}
    - {name: quantity, type: int, nullable: false}
    - {name: payment_method, type: string, nullable: true}
    - {name: channel_mode, type: string, nullable: false, note: "'online' for this stream"}
    - {name: event_timestamp, type: timestamp, nullable: false, note: "producer-assigned event time, distinct from Kafka broker arrival time captured as kafka_processing_time"}
  dedup_strategy: >
    Silver drops duplicate order_id values keeping the row with the
    latest kafka_offset per partition, using a streaming dropDuplicates
    with event-time watermark (see src/silver/dedup_streaming.py).
  late_event_tolerance: "10 minutes"
  intentional_anomalies:
    - {code: MALFORMED_JSON, effect: "payload is not valid JSON", detection_rule: "kept as raw_payload string in Bronze (never dropped); Silver's from_json parse produces NULL typed columns, routed to quarantine by rule ORD_PARSE_OK"}
    - {code: NEGATIVE_QTY, effect: "quantity <= 0", detection_rule: "silver rule ORD_QTY_POSITIVE, action=quarantine"}
    - {code: DUPLICATE_ORDER, effect: "same order_id published twice (simulating producer retry)", detection_rule: "dedup_strategy above"}
  anomaly_rate: 0.05

inventory_restock:
  topic: inventory_restock   # corrected name; repo code previously subscribed to `inventory_events` — confirm with team before relying on this in production
  destination:
    bronze: bronze.kafka_inventory_restock_raw
    silver: silver.inventory_restock_clean
    gold_contributes_to: [fact_inventory_movement]
  grain: "one row per restock_event_id"
  business_key: restock_event_id
  event_time_field: event_timestamp
  payload_schema:
    - {name: restock_event_id, type: string, nullable: false}
    - {name: store_id, type: int, nullable: false}
    - {name: product_id, type: int, nullable: false}
    - {name: restock_quantity, type: int, nullable: false}
    - {name: restock_type, type: string, nullable: false, note: "delivery | transfer | damage_writeoff"}
    - {name: event_timestamp, type: timestamp, nullable: false}
  dedup_strategy: "same pattern as online_orders, keyed on restock_event_id"
  late_event_tolerance: "10 minutes"
  anomaly_rate: 0.05
