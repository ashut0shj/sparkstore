# Data contract: Stores (SCD Type 2 dimension source)
# Source: ADLS Gen2 landing/operational/stores/ (CSV, Auto Loader)
# Owner: Nagasupriya Bandlamudi (ingestion), Khushi Gupta (SCD2 + Gold dim_store)

dataset: stores
source_system: ADLS_OPERATIONAL
destination:
  bronze: bronze.adls_stores
  silver: silver.stores_scd2
  gold_contributes_to: [dim_store]

grain: "one row per (store_id, version) in Silver after SCD2; one row per store_id as currently open in source CSV drops"
business_key: store_id
scd2_change_detection_fields: [store_type, total_sqft, grocery_sqft, store_name]

columns:
  - {name: store_id, type: int, nullable: false}
  - {name: region_id, type: int, nullable: false, fk: regions}
  - {name: store_type, type: string, nullable: false}
  - {name: store_name, type: string, nullable: false}
  - {name: store_street_address, type: string, nullable: true}
  - {name: store_city, type: string, nullable: true}
  - {name: store_state, type: string, nullable: true}
  - {name: store_country, type: string, nullable: true, note: "inconsistent casing/spelling injected intentionally, e.g. 'USA ', 'mex', 'United States'"}
  - {name: store_phone, type: string, nullable: true}
  - {name: first_opened_date, type: date, nullable: false}
  - {name: last_remodel_date, type: date, nullable: true}
  - {name: total_sqft, type: int, nullable: true}
  - {name: grocery_sqft, type: int, nullable: true}

scd2_design: >
  ~18% of stores are generated with two source rows sharing the same
  store_id: an "opening" record (first_opened_date, original sqft/type)
  and a later "remodel" record (expanded sqft, upgraded store_type, a
  later effective date). Silver SCD2 logic (src/silver/scd2_customer_store.py)
  assigns effective_from/effective_to and is_current using the remodel's
  effective date as the change boundary, so that historical fact_sales
  rows join to the store version that was active at transaction_date.

intentional_anomalies:
  - {code: INCONSISTENT_COUNTRY, field: store_country, effect: "'USA ' / 'mex' / 'United States' variants for the same real country", detection_rule: "silver standardization rule STORE_COUNTRY_NORMALIZE maps variants to a canonical ISO-ish country name; this is a WARN-level cleanse, not a quarantine, since the value is recoverable"}

anomaly_rate: 0.05
