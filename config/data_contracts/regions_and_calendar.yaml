# Data contracts: Regions and Calendar (small reference/dimension sources)
# Source: ADLS Gen2 landing/operational/{regions,calendar}/ (CSV, Auto Loader)
# Owner: Nagasupriya Bandlamudi (ingestion), Khushi Gupta (Gold dim_region / dim_date)

regions:
  destination: {bronze: bronze.regions, silver: silver.regions_clean, gold_contributes_to: [dim_region]}
  grain: "one row per region_id"
  business_key: region_id
  columns:
    - {name: region_id, type: int, nullable: false}
    - {name: sales_district, type: string, nullable: true}
    - {name: sales_region, type: string, nullable: false, note: "used for row-level security region filter"}

calendar:
  destination: {bronze: bronze.calendar, silver: silver.calendar_clean, gold_contributes_to: [dim_date]}
  grain: "one row per calendar date"
  business_key: date
  columns:
    - {name: date, type: date, nullable: false}
  generation_note: >
    The original sample only had 9 scattered sample dates. The synthetic
    generator pre-populates one row per calendar day from 1999-01-01
    through 2026-12-31 and derives year/quarter/month/day_of_week/
    is_weekend/fiscal_period in Silver rather than storing them raw,
    so the Bronze contract stays a single `date` column matching the
    original source shape.
  anomaly_rate: 0.0   # calendar is generated, not sampled from a noisy source; no anomalies injected
