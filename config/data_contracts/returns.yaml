# Data contract: Returns
# Source: ADLS Gen2 landing/pos/returns/ (CSV, Auto Loader)
# Owner: Nagasupriya Bandlamudi (ingestion), Khushi Gupta (Silver/Gold)

dataset: returns
source_system: ADLS_POS
destination:
  bronze: bronze.adls_returns
  silver: silver.returns_clean
  gold_contributes_to: [fact_returns]

grain: "one row per (return_date, product_id, store_id) occurrence as supplied by source; synthetic generator adds a return_id for a stable business key"
business_key: return_id

columns:
  - {name: return_id, type: string, nullable: false, note: "synthesized stable key (original source had none)"}
  - {name: return_date, type: date, nullable: false}
  - {name: product_id, type: int, nullable: false, fk: products}
  - {name: store_id, type: int, nullable: false, fk: stores}
  - {name: quantity, type: int, nullable: false}
  - {name: return_reason, type: string, nullable: true, note: "synthetic addition; original source lacked a reason code"}

intentional_anomalies:
  - {code: ORPHAN_PRODUCT, field: product_id, effect: "product_id not present in product_master", detection_rule: "silver referential-integrity rule RET_FK_PRODUCT: anti-join against product dimension, action=quarantine"}
  - {code: NEGATIVE_QTY, field: quantity, effect: "quantity <= 0", detection_rule: "silver rule RET_QTY_POSITIVE: quantity > 0, action=quarantine"}

anomaly_rate: 0.05
