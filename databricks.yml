bundle:
  name: maven_market_capstone

include:
  - resources/*.yml

variables:
  catalog:
    description: >
      Unity Catalog catalog that every parameterized notebook, the
      pipeline, and both jobs resolve against. Defaults to maven_test
      (the scratch/iteration catalog) when nothing overrides it.
    default: maven_test

targets:
  # Local / ad-hoc deploys: `databricks bundle deploy` with no -t flag
  # lands here and uses maven_test, same as every notebook's own
  # spark.conf.get(..., "maven_test") fallback.
  dev:
    default: true
    workspace:
      host: https://adb-7405618616693902.2.azuredatabricks.net
    variables:
      catalog: maven_test

  # The only target CI/CD ever deploys to. Always resolves to maven_dev,
  # on every push to main and on every PR, per the CI/CD policy below.
  prod:
    mode: production
    workspace:
      host: https://adb-7405618616693902.2.azuredatabricks.net
    variables:
      catalog: maven_dev
    run_as:
      # The CI service principal (see README "CI/CD authentication setup").
      # Replace with your own service principal's Application/Client ID -
      # this is not sensitive, only its secret is, so it's fine committed
      # here in plain text.
      service_principal_name: "c12d752e-1328-45bb-bdea-5375cac70984"
