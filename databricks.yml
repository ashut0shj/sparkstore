bundle:
  name: maven_market_capstone

include:
  - resources/bronze_job.yml
  - resources/dashboard.yml
  - resources/pipeline.yml
  - resources/retail_sales_and_inventory_analytics.genie_space.yml
  - resources/silver_gold_job.yml
  - resources/maven_kafka_silvergold.yml
  - resources/maven_kafka_job.yml

variables:
  catalog:
    description: >
      Unity Catalog catalog that every parameterized notebook, the
      pipeline, and both jobs resolve against. Defaults to maven_test
      (the scratch/iteration catalog) when nothing overrides it.
    default: maven_test
  sql_warehouse_id:
    description: "The Serverless or Classic SQL Warehouse ID used to render the Lakeview Dashboard."

targets:
  dev:
    default: true
    workspace:
      host: https://adb-7405618616693902.2.azuredatabricks.net
    variables:
      catalog: maven_test
      sql_warehouse_id: "YOUR_DEV_SQL_WAREHOUSE_ID" # <--- Replace with your Dev Warehouse ID

  prod:
    mode: production
    workspace:
      host: https://adb-7405618616693902.2.azuredatabricks.net
      root_path: /Workspace/Users/c12d752e-1328-45bb-bdea-5375cac70984/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: maven_dev
      sql_warehouse_id: "5a59190dddc02de1" # <--- Replace with your Prod Warehouse ID
    run_as:
      service_principal_name: "c12d752e-1328-45bb-bdea-5375cac70984"