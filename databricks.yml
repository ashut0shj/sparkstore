bundle:
  name: maven_market_capstone

include:
  - resources/bronze_job.yml
  - resources/dashboard.yml
  - resources/pipeline.yml
  # - resources/retail_sales_and_inventory_analytics.genie_space.yml
  - resources/silver_gold_job.yml
  - resources/maven_kafka_silvergold.yml
  - resources/maven_kafka_job.yml

variables:
  catalog:
    description: >
      Unity Catalog catalog that every parameterized notebook, the
      pipeline, and both jobs resolve against. Defaults to maven_test
      (the scratch/iteration catalog) when nothing overrides it.
    default: maven_test
  sql_warehouse_id:
    description: "The Serverless or Classic SQL Warehouse ID used to render the Lakeview Dashboard."

targets:
  dev:
    default: true
    workspace:
      host: https://adb-7405616945565645.5.azuredatabricks.net
    variables:
      catalog: maven_test
      sql_warehouse_id: "df6e0f4139c6d368" # <--- Replace with your Dev Warehouse ID

  prod:
    mode: production
    workspace:
      host: https://adb-7405616945565645.5.azuredatabricks.net
      root_path: /Workspace/Users/6e15d7e4-912f-464c-bc7b-2507be769f80/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: maven_dev
      sql_warehouse_id: "df6e0f4139c6d368" # <--- Replace with your Prod Warehouse ID
    run_as:
      service_principal_name: "6e15d7e4-912f-464c-bc7b-2507be769f80"