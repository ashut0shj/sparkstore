name: Databricks Asset Bundle Deployment

on:
  push:
    branches:
      - main
      - prod
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Bundle Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate Bundle
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          ARM_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          DATABRICKS_AUTH_TYPE: azure-client-secret
        run: |
          databricks bundle validate

  deploy-dev:
    name: Deploy to Dev (maven_dev)
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy Bundle to Main Target
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          ARM_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          DATABRICKS_AUTH_TYPE: azure-client-secret
        run: |
          databricks bundle deploy --target main

  deploy-prod:
    name: Deploy to Prod (maven_prod)
    needs: validate
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy Bundle to Prod Target
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          ARM_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          DATABRICKS_AUTH_TYPE: azure-client-secret
        run: |
          databricks bundle deploy --target prod