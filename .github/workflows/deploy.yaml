# .github/workflows/deploy.yaml
#
# One simple pipeline: run the (small, fast) local test suite, then
# deploy the Databricks Asset Bundle and trigger the medallion job --
# so the only thing CI/CD does here is get code onto Databricks and
# kick off the jobs/pipelines that actually run it. No separate lint/
# secret-scan/double-validate stages -- keep it to what's needed.
#
# - push to `test` branch  -> deploy to the `dev` target (maven_test catalog)
# - push to `main` branch  -> deploy to the `main` target (maven_dev catalog)

name: Deploy

on:
  push:
    branches: [test, main]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run local test suite
        run: python -m unittest discover -s tests/unit -v

      - uses: databricks/setup-cli@main

      - name: Pick the bundle target for this branch
        id: pick_target
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "target=main" >> "$GITHUB_OUTPUT"
          else
            echo "target=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy bundle
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          ARM_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          DATABRICKS_AUTH_TYPE: azure-client-secret
        run: databricks bundle deploy --target ${{ steps.pick_target.outputs.target }}

      - name: Run medallion_pipeline_job
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          ARM_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          DATABRICKS_AUTH_TYPE: azure-client-secret
        # `bundle run` resolves the job's real ID from the deployed bundle
        # state itself -- never a hardcoded job ID that breaks the moment
        # the job is ever recreated.
        run: databricks bundle run medallion_pipeline_job --target ${{ steps.pick_target.outputs.target }}
